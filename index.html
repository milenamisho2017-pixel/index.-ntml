<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212121">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Бот</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#212121;color:#ececec;font:16px/1.5 system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:2px;padding:10px 8px 10px 16px;border-bottom:1px solid #333;background:#212121}
.t{flex:1;min-width:0}
.t b{font-size:18px;display:block;line-height:1.2}
#st{font-size:12px;color:#8e8e8e;display:block}
.ib{background:none;border:0;color:#ececec;font-size:20px;padding:6px 7px;border-radius:8px;cursor:pointer}
.ib:active{background:#333}
.ib.off{opacity:.35}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.m{max-width:88%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word}
.m img{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-bottom:6px}
.m code{background:#111;padding:1px 6px;border-radius:6px;font-size:.92em}
.u{align-self:flex-end;background:#303030;border-bottom-right-radius:6px}
.a{align-self:flex-start;position:relative;padding-left:44px;min-height:44px}
.a::before{content:'🤖';position:absolute;left:4px;top:8px;width:30px;height:30px;border-radius:50%;background:#2f2f2f;display:flex;align-items:center;justify-content:center;font-size:16px}
.sys{align-self:center;color:#8e8e8e;font-size:14px;text-align:center}
.chips{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:4px}
.chips button{background:#2a2a2a;color:#ececec;border:1px solid #3a3a3a;border-radius:18px;padding:9px 16px;font:inherit;font-size:15px}
.chips button:active{background:#333}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#aaa;animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
#prev{display:none;padding:8px 16px 0}
#prev div{display:inline-block;position:relative}
#prev img{height:70px;border-radius:10px;display:block}
#prev button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:#e5484d;color:#fff;cursor:pointer}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));align-items:flex-end}
#in{flex:1;background:#2f2f2f;color:#ececec;border:1px solid transparent;border-radius:24px;padding:12px 16px;font:inherit;resize:none;max-height:120px;outline:none}
#in:focus{border-color:#555}
.c{width:44px;height:44px;border-radius:50%;border:0;font-size:18px;cursor:pointer;flex-shrink:0}
#att,#mic{background:#2f2f2f;color:#fff}
#mic.on{background:#e5484d;animation:p 1s infinite}
#send{background:#fff;color:#000}
@keyframes p{50%{opacity:.5}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90%;text-align:center}
#set{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#set>div{background:#2a2a2a;padding:20px;border-radius:16px;width:100%;max-width:400px;max-height:90dvh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#set input[type=password],#set textarea{background:#1a1a1a;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;font:inherit}
#set button{background:#fff;border:0;border-radius:8px;padding:10px;font:inherit}
#set button.gr{background:#444;color:#fff}
label{display:flex;gap:8px;align-items:center}
/* Студио */
#stu{position:fixed;inset:0;background:#212121;display:none;flex-direction:column;overflow-y:auto;padding:0 14px 24px;z-index:5}
.sh{display:flex;align-items:center;gap:8px;padding:12px 0;position:sticky;top:0;background:#212121;z-index:2}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{flex:0 0 auto;padding:9px 14px;border:0;border-radius:10px;background:#2f2f2f;color:#ececec;font:inherit;font-size:14px}
.tabs button.on{background:#fff;color:#000}
#tray{display:flex;gap:8px;overflow-x:auto;padding:8px 4px;min-height:8px}
.th{position:relative;flex:0 0 64px;height:64px}
.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid transparent;max-height:none;margin:0}
.th.sel img{border-color:#fff}
.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#e5484d;color:#fff;font-size:12px;line-height:1}
.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.sb{flex:1;padding:11px 8px;border:0;border-radius:10px;background:#2f2f2f;color:#ececec;font:inherit;min-width:90px}
.sb.pri{background:#fff;color:#000;font-weight:600}
.sb:disabled{opacity:.5}
#stu select{flex:1;padding:10px;border-radius:10px;background:#2f2f2f;color:#ececec;border:0;font:inherit}
.pn{display:none;flex-direction:column;gap:8px;margin:6px 0}
.pn.on{display:flex}
.pn label{justify-content:space-between;font-size:14px}
.pn input[type=range]{flex:1;margin-left:10px}
.pn input[type=text]{background:#2f2f2f;color:#fff;border:0;border-radius:10px;padding:10px;font:inherit}
.pr{display:flex;gap:6px;flex-wrap:wrap}
.pr button{padding:8px 12px;border:0;border-radius:16px;background:#2f2f2f;color:#ececec;font:inherit;font-size:13px}
.note{font-size:13px;color:#999}
.cr{display:flex;align-items:center;gap:8px;background:#2a2a2a;border-radius:10px;padding:6px 10px;font-size:14px;margin-top:6px}
.cr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr button{border:0;background:#3a3a3a;color:#fff;border-radius:8px;width:30px;height:30px}
#cv,#vd{display:block;margin:10px auto;max-width:100%;max-height:58dvh;border-radius:12px;background:#111}
#vd{display:none}
#hint{text-align:center;color:#aaa;font-size:14px;min-height:20px}
</style>
</head>
<body>
<header>
  <div class="t"><b>🤖 Бот</b><span id="st"></span></div>
  <button class="ib" id="art" title="Студио">🎨</button>
  <button class="ib" id="ear" title="Слушане">👂</button>
  <button class="ib" id="spk" title="Глас">🔊</button>
  <button class="ib" id="del" title="Изтрий чата">🗑️</button>
  <button class="ib" id="gear" title="Настройки">⚙️</button>
</header>
<div id="msgs"></div>
<div id="prev"><div><img id="pimg"><button id="px" type="button">✕</button></div></div>
<form id="f">
  <button type="button" class="c" id="att">📎</button>
  <button type="button" class="c" id="mic">🎤</button>
  <textarea id="in" rows="1" placeholder="Напиши съобщение..."></textarea>
  <button class="c" id="send">➤</button>
</form>
<input type="file" id="file" accept="image/*" hidden>
<div id="toast"></div>

<div id="set"><div>
  <b>Настройки</b>
  <input type="password" id="key" placeholder="Anthropic API ключ">
  <textarea id="instr" rows="4" placeholder="Постоянни инструкции към бота (по желание)"></textarea>
  <label><input type="checkbox" id="wake"> Събуждане с „Бот“</label>
  <label><input type="checkbox" id="speak"> Отговаряй на глас</label>
  <label><input type="checkbox" id="web"> Търсене в интернет</label>
  <button class="gr" id="inst" type="button" style="display:none">📲 Инсталирай приложението</button>
  <button class="gr" id="icons" type="button">⬇️ Свали PNG иконите</button>
  <button class="gr" id="dn" type="button">Изтрий всички записи</button>
  <button id="save" type="button">Запази</button>
</div></div>

<div id="stu">
  <div class="sh"><button class="ib" id="sback">←</button><b>🎨 Студио</b></div>
  <div class="tabs">
    <button data-t="col" class="on">Колаж</button>
    <button data-t="edit">Редакция</button>
    <button data-t="land">Пейзаж</button>
    <button data-t="vid">Видео</button>
    <button data-t="clip">Клипове</button>
  </div>
  <div id="tray"></div>
  <div class="bar">
    <button class="sb" id="addp">➕ Снимки</button>
    <select id="asp">
      <option value="1:1">Квадрат 1:1</option>
      <option value="4:5">Портрет 4:5</option>
      <option value="9:16">Вертикално 9:16</option>
      <option value="16:9">Широко 16:9</option>
    </select>
  </div>

  <div id="p-col" class="pn on">
    <label>Разстояние<input type="range" id="cgap" min="0" max="40" value="12"></label>
    <label>Фон<input type="color" id="cbg" value="#212121"></label>
  </div>
  <div id="p-edit" class="pn">
    <div class="pr" id="pre">
      <button data-p="orig">Оригинал</button><button data-p="bright">Ярко</button>
      <button data-p="bw">Ч/Б</button><button data-p="retro">Ретро</button><button data-p="drama">Драма</button>
    </div>
    <label>Яркост<input type="range" min="50" max="150" value="100" data-k="b"></label>
    <label>Контраст<input type="range" min="50" max="150" value="100" data-k="c"></label>
    <label>Наситеност<input type="range" min="0" max="200" value="100" data-k="s"></label>
    <label>Размазване<input type="range" min="0" max="10" value="0" data-k="blur"></label>
    <label><span><input type="checkbox" data-k="sq"> Квадрат</span><span><input type="checkbox" data-k="vig"> Виньетка</span></label>
    <button class="sb" id="rot">⟳ Завърти</button>
    <input type="text" data-k="txt" placeholder="Текст върху снимката">
  </div>
  <div id="p-land" class="pn">
    <select id="lsty"><option>Залез</option><option>Планина</option><option>Нощ</option><option>Есен</option><option>Море</option></select>
    <div class="bar"><button class="sb" id="lnew">🔄 Друг пейзаж</button><button class="sb" id="ladd">➕ Към снимките</button></div>
  </div>
  <div id="p-vid" class="pn">
    <label>Дължина<input type="range" id="vdur" min="5" max="30" value="15"><span id="vdv">15 с</span></label>
    <label><span><input type="checkbox" id="vkb" checked> Плавно приближаване</span></label>
    <input type="text" id="vtxt" placeholder="Заглавие във видеото (по желание)">
  </div>
  <div id="p-clip" class="pn">
    <button class="sb" id="addc">🎞️ Добави клипове</button>
    <div id="clist"></div>
    <div class="note" id="ctot"></div>
    <label><span><input type="checkbox" id="cfade" checked> Плавно затъмняване между клиповете</span></label>
    <input type="text" id="ctxt" placeholder="Заглавие в началото (по желание)">
    <div class="note">До 8 клипа, общо до 30 секунди. Излишното се отрязва. Звукът от клиповете се запазва.</div>
  </div>

  <div id="hint"></div>
  <canvas id="cv" width="10" height="10"></canvas>
  <video id="vd" controls playsinline></video>
  <div class="bar">
    <button class="sb pri" id="gen">Създай</button>
    <button class="sb" id="sv">💾 Запази</button>
    <button class="sb" id="shr">📤 Сподели</button>
  </div>
  <input type="file" id="files" accept="image/*" multiple hidden>
  <input type="file" id="cfiles" accept="video/*" multiple hidden>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const get=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v===null?d:v}catch{return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let chat=get('chat',[]), notes=get('notes',[]);
let cfg=Object.assign({key:'',wake:true,speak:true,instr:'',web:true},get('cfg',{}));
let busy=false,speaking=false,awaiting=false,rec=null,pic=null,ctl=null,dip=null;

function saveChat(){if(chat.length>80)chat=chat.slice(-80);put('chat',chat);}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity=0;},2800);}
function status(){
  $('#st').textContent=busy?'пише...':awaiting?'слушам те...':cfg.wake?'слушам „Бот“':'слушането е изключено';
  $('#ear').classList.toggle('off',!cfg.wake);
  $('#spk').textContent=speaking?'⏹':cfg.speak?'🔊':'🔇';
  $('#spk').classList.toggle('off',!cfg.speak&&!speaking);
  $('#mic').classList.toggle('on',awaiting);
  $('#send').textContent=busy?'⏹':'➤';
}
function dl(u,n){const a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();}
function add(role,text,img){
  const d=document.createElement('div');
  d.className='m '+(role==='user'?'u':role==='sys'?'sys':'a');
  if(img){const i=document.createElement('img');i.src=img;d.appendChild(i);}
  d.appendChild(document.createTextNode(text));
  $('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d;
}
function fmtInto(el,t){
  el.textContent='';
  const lines=t.split('\n');
  lines.forEach((ln,li)=>{
    let s=ln,pre='',head=false,m;
    if(m=s.match(/^\s*[-*•]\s+(.*)$/)){pre='• ';s=m[1];}
    if(m=s.match(/^#{1,3}\s+(.*)$/)){s=m[1];head=true;}
    const row=document.createElement(head?'b':'span');
    if(pre) row.appendChild(document.createTextNode(pre));
    s.split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(p=>{
      if(!p) return;
      if(p.length>4&&p.startsWith('**')&&p.endsWith('**')){const e=document.createElement('b');e.textContent=p.slice(2,-2);row.appendChild(e);}
      else if(p.length>2&&p.startsWith('`')&&p.endsWith('`')){const e=document.createElement('code');e.textContent=p.slice(1,-1);row.appendChild(e);}
      else row.appendChild(document.createTextNode(p));
    });
    el.appendChild(row);
    if(li<lines.length-1) el.appendChild(document.createElement('br'));
  });
}
function showReply(b,t){
  const m=t.match(/<svg[\s\S]*?<\/svg>/i);
  if(!m){fmtInto(b,t);return;}
  b.textContent='';
  const i=new Image();
  i.style.cssText='width:100%;max-height:none;background:#fff;border-radius:12px;margin:4px 0';
  i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(m[0]);
  b.appendChild(i);
  const bt=document.createElement('button');
  bt.textContent='💾 Запази като PNG';
  bt.style.cssText='display:block;margin:6px 0;padding:8px 12px;border:0;border-radius:10px;background:#2f2f2f;color:#fff;font:inherit';
  bt.onclick=()=>{
    const w=1080,h=Math.round(w*(i.naturalHeight||1)/(i.naturalWidth||1));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(i,0,0,w,h);
    c.toBlob(bl=>dl(URL.createObjectURL(bl),'kartina-'+Date.now()+'.png'));
  };
  b.appendChild(bt);
  const rest=t.replace(m[0],'').trim();
  if(rest){const sp=document.createElement('span');fmtInto(sp,rest);b.appendChild(sp);}
}
function addA(t){const b=add('assistant','');showReply(b,t);return b;}
function render(){
  $('#msgs').innerHTML='';
  if(!chat.length){
    add('sys','Здравей! Аз съм Бот. Кажи „Бот“ или ми пиши.');
    const row=document.createElement('div'); row.className='chips';
    [['☀️ Какво е времето днес?',1],['🎨 Нарисувай залез над морето',1],['📝 Запиши нещо','запиши ']].forEach(([l,v])=>{
      const b=document.createElement('button'); b.type='button'; b.textContent=l;
      b.onclick=()=>{if(v===1) send(l.replace(/^\S+\s/,'')); else {$('#in').value=v;$('#in').focus();}};
      row.appendChild(b);
    });
    $('#msgs').appendChild(row);
  }
  chat.forEach(m=>{
    if(m.role==='assistant') addA(m.content);
    else add(m.role,(m.img?'📷 ':'')+m.content);
  });
}
function say(t){
  if(!cfg.speak||!window.speechSynthesis) return;
  t=t.replace(/<svg[\s\S]*?<\/svg>/gi,' Картината е готова. ').replace(/[*`#]/g,'');
  const u=new SpeechSynthesisUtterance(t); u.lang='bg-BG';
  u.onstart=()=>{speaking=true;status();};
  u.onend=u.onerror=()=>{speaking=false;status();};
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function local(t){
  const l=t.toLowerCase().trim();
  let m=t.trim().match(/^(запиши|запомни)[\s:,]+(.+)/i);
  if(m){notes.push(m[2]);put('notes',notes);return 'Записах: '+m[2];}
  if(/изтрий (всичко|бележките|записите)/.test(l)){notes=[];put('notes',notes);return 'Изтрих всички записи.';}
  if(/изтрий (чата|разговора)/.test(l)){chat=[];saveChat();render();return 'Изтрих разговора.';}
  if(/(покажи|прочети).*(бележките|записите)/.test(l))
    return notes.length?'Записи:\n- '+notes.join('\n- '):'Нямам записи.';
  return null;
}
function errMsg(status,txt){
  let m=''; try{m=JSON.parse(txt).error.message||'';}catch{m=txt||'';}
  if(status===401) return 'Грешен или изтекъл API ключ. Провери го в ⚙️ Настройки.';
  if(/web.?search/i.test(m)) return 'Търсенето в интернет не е включено. Включи го в Console → Settings → Privacy или го изключи от ⚙️.';
  if(status===402||/credit balance|billing/i.test(m)) return 'Няма достатъчно кредит. Добави от console.anthropic.com → Billing.';
  if(status===429) return 'Твърде много заявки. Изчакай малко и опитай пак.';
  if(status===529||status>=500) return 'Услугата е претоварена. Опитай след малко.';
  return 'Грешка: '+m.slice(0,200);
}

/* Снимка към чата */
function toData(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,1280/Math.max(img.width,img.height));
      const w=Math.round(img.width*k), h=Math.round(img.height*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.8));
    };
    img.onerror=rej; img.src=url;
  });
}
function clearPic(){pic=null;$('#prev').style.display='none';}
$('#att').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{pic=await toData(f);$('#pimg').src=pic;$('#prev').style.display='block';}
  catch{toast('Не успях да заредя снимката.');}
};
$('#px').onclick=clearPic;

/* Изпращане */
async function send(text){
  text=(text||'').trim(); const p=pic;
  if((!text&&!p)||busy) return;
  if(!p){
    const r=local(text);
    if(r!==null){
      chat.push({role:'user',content:text}); add('user',text);
      chat.push({role:'assistant',content:r}); addA(r);
      saveChat(); say(r); return;
    }
  }
  if(!cfg.key){toast('Добави API ключ в ⚙️ Настройки.');$('#in').value=text;return;}
  if(!navigator.onLine){toast('Няма интернет.');if(!p)$('#in').value=text;return;}
  if(window.speechSynthesis) speechSynthesis.cancel();
  const q=text||'Какво виждаш на снимката?';
  chat.push({role:'user',content:q,img:!!p}); add('user',q,p);
  clearPic(); busy=true; status();
  const bubble=add('assistant',''); bubble.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  let full='';
  let msgs=chat.slice(-20).map(m=>({role:m.role,content:(m.img?m.content+' [изпратена снимка]':m.content).replace(/<svg[\s\S]*?<\/svg>/gi,'[нарисувана картина]')}));
  while(msgs.length&&msgs[0].role!=='user') msgs.shift();
  if(p) msgs[msgs.length-1].content=[
    {type:'image',source:{type:'base64',media_type:'image/jpeg',data:p.split(',')[1]}},
    {type:'text',text:q}
  ];
  const body={model:'claude-sonnet-5-5',max_tokens:4000,stream:true,

function ridge(x,W,H,y0,amp,col,R){
  const p=[R()*9,R()*9,R()*9]; x.beginPath(); x.moveTo(0,H);
  for(let i=0;i<=W;i+=6){
    const t=i/W;
    x.lineTo(i,y0-amp*(.55+.3*Math.sin(t*3.1+p[0])+.18*Math.sin(t*8+p[1])+.08*Math.sin(t*21+p[2])));

  const hz=H*(.58+R()*.08);
  let g=x.createLinearGradient(0,0,0,hz);
  S.sky.forEach((c,i)=>g.addColorStop(i/(S.sky.length-1),c));

  if(S.stars){x.fillStyle='#fff';for(let i=0;i<220;i++){x.globalAlpha=.3+R()*.7;x.fillRect(R()*W,R()*hz*.85,1+R()*1.5,1+R()*1.5);}x.globalAlpha=1;}
  const sx=W*(.25+R()*.5), sy=hz-H*(.08+R()*.18), sr=W*.06;
  g=x.createRadialGradient(sx,sy,0,sx,sy,sr*6);
  g.addColorStop(0,S.sun+'ff'); g.addColorStop(.2,S.sun+'aa'); g.addColorStop(1,S.sun+'00');
  x.fillStyle=g; x.fillRect(0,0,W,H);

  x.filter='blur(14px)'; x.fillStyle=S.stars?'rgba(120,140,200,.25)':'rgba(255,255,255,.3)';
  for(let i=0;i<5;i++){x.beginPath();x.ellipse(R()*W,H*(.08+R()*.3),W*(.1+R()*.15),H*(.02+R()*.03),0,0,7);x.fill();}
  x.filter='none';
  S.mt.forEach((c,i)=>ridge(x,W,H,hz+i*H*.035,H*(.2-.03*i),c,R));
  if(S.sea){
    g=x.createLinearGradient(0,hz,0,H);

    x.fillStyle=g; x.fillRect(0,hz,W,H-hz);

async function makeVideo(){

    x.globalAlpha=1; x.fillStyle='#000'; x.fillRect(0,0,W,H);

    if(i<photos.length-1&&lp>per-fade){x.globalAlpha=(lp-(per-fade))/fade;vf(x,W,H,photos[i+1],0,kb);x.globalAlpha=1;}
    if(ttl){const fs=Math.round(W/16);x.font='bold '+fs+'px system-ui';x.textAlign='center';x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=fs/3;x.fillText(ttl,W/2,H-fs*1.2);x.shadowBlur=0;}
  };

    frame(0);
    const rc=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:4000000});
    const ch=[]; rc.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
    const stopped=new Promise(r=>{rc.onstop=r;});
    rc.start(); const t0=performance.now();

      await AC.resume();
      clips.forEach(c=>{if(!c.node){c.node=AC.createMediaElementSource(c.el);c.node.connect(AD);}});
      tracks.push(...AD.stream.getAudioTracks());
    }catch{}
    const rc=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:4000000});
    const ch=[]; rc.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
    const stopped=new Promise(r=>{rc.onstop=r;});
    x.fillStyle='#000'; x.fillRect(0,0,W,H);
    rc.start(); let used=0;
    for(const c of clips){
      const room=30-used; if(room<=.2) break;
      const len=Math.min(c.dur,room);
      c.el.currentTime=0;
      try{await c.el.play();}catch{c.el.muted=true;try{await c.el.play();}catch{continue;}}
      const t0=performance.now();
      await new Promise(res=>{
        const f=()=>{
          const t=(performance.now()-t0)/1000;
          if(t>=len||c.el.ended){res();return;}
          x.globalAlpha=1; x.fillStyle='#000'; x.fillRect(0,0,W,H);
          cover(x,c.el,0,0,W,H,0);
          if(fade){
            const a=Math.max(0,1-t/.3,1-(len-t)/.3);
            if(a>0){x.globalAlpha=Math.min(1,a);x.fillStyle='#000';x.fillRect(0,0,W,H);x.globalAlpha=1;}
          }
          if(ttl&&used+t<3){
            const fs=Math.round(W/16);x.font='bold '+fs+'px system-ui';x.textAlign='center';x.fillStyle='#fff';
            x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=fs/3;x.fillText(ttl,W/2,H-fs*1.2);x.shadowBlur=0;
          }
          hint('Записвам... още '+Math.ceil(total-used-t)+' с');
          requestAnimationFrame(f);
        };
        f();
      });
      c.el.pause(); used+=len;
    }
    rc.stop(); await stopped; finishVideo(mime,ch);
  }catch(e){failVideo('Грешка при сглобяването на клиповете.');}
}
function syncE(){
  $$('#p-edit [data-k]').forEach(el=>{
    const v=E[el.dataset.k];
    if(el.type==='checkbox') el.checked=!!v; else el.value=v;
  });
}
function saveOut(){
  if($('#vd').style.display==='block'&&vurl){dl(vurl,'video-'+Date.now()+'.'+vext);return;}
  cv.toBlob(b=>dl(URL.createObjectURL(b),'bot-'+Date.now()+'.png'),'image/png');
}
async function shareOut(){
  let blob,name;
  if($('#vd').style.display==='block'&&vblob){blob=vblob;name='video.'+vext;}
  else{blob=await new Promise(r=>cv.toBlob(r,'image/png'));name='bot.png';}
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});}catch{}}
  else saveOut();
}

$('#art').onclick=()=>{$('#stu').style.display='flex';run();};
$('#sback').onclick=()=>{$('#stu').style.display='none';};
$('#addp').onclick=()=>$('#files').click();
$('#files').onchange=async e=>{
  for(const f of e.target.files){
    if(photos.length>=12) break;
    await new Promise(r=>{const im=new Image();im.onload=()=>{photos.push(im);r();};im.onerror=r;im.src=URL.createObjectURL(f);});
  }
  e.target.value=''; sel=Math.min(sel,Math.max(0,photos.length-1)); trayDraw(); run();
};
$$('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  $$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.pn').forEach(p=>p.classList.toggle('on',p.id==='p-'+tab));
  if(tab==='vid') hint('Натисни „Създай“, за да запиша видеото от снимките.');
  if(tab==='clip') hint('Добави клипове и натисни „Създай“.');
  run();
});
$('#stu').addEventListener('input',e=>{
  const el=e.target,k=el.dataset.k;
  if(k) E[k]=el.type==='checkbox'?el.checked:el.type==='text'?el.value:+el.value;
  if(el.id==='vdur') $('#vdv').textContent=el.value+' с';
  run();
});
$$('#pre button').forEach(b=>b.onclick=()=>{Object.assign(E,E0,PRE[b.dataset.p]);syncE();run();});
$('#rot').onclick=()=>{E.rot=(E.rot+1)%4;run();};
$('#lnew').onclick=()=>{seed=Math.floor(Math.random()*1e6);run();};
$('#ladd').onclick=()=>{
  if(tab!=='land') return;
  if(photos.length>=12) return hint('Максимум 12 снимки.');
  const im=new Image();
  im.onload=()=>{photos.push(im);sel=photos.length-1;trayDraw();hint('Добавено към снимките.');};
  im.src=cv.toDataURL('image/jpeg',.92);
};
$('#gen').onclick=()=>{if(tab==='vid') makeVideo(); else if(tab==='clip') makeClips(); else run();};
$('#sv').onclick=saveOut;
$('#shr').onclick=shareOut;

render(); status();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(cfg.wake) document.body.addEventListener('click',listen,{once:true});
